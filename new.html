<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <style>
       
        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f4;
          
        }

        .topbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px; 
            background-color: #2c3e50;
            color: white;
            display: flex;
            align-items: center;
            padding: 0 15px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            z-index: 1000; 
        }

        .menu-btn {
            font-size: 28px;
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            line-height: 1; 
            padding: 0;
        }

        .site-title {
            margin-left: 15px;
            font-size: 20px;
            font-weight: 600;
        }

        
        .sidebar {
            position: fixed;
            top: 0; 
            left: -250px; 
            width: 250px;
            height: 100%;
            background-color: #34495e;
            overflow-y: auto;
            transition: left 0.3s ease;
            padding-top: 60px; 
            z-index: 999;
        }

        .sidebar.show {
            left: 0;  
        }

        .sidebar a, .dropdown-btn {
            display: block;
            padding: 15px 20px;
            color: white;
            text-decoration: none;
            font-size: 16px;
            border: none;
            background: none;
            text-align: left;
            width: 100%;
            cursor: pointer;
        }

        .sidebar a:hover, .dropdown-btn:hover {
            background-color: #3d566e;
        }

     
        .dropdown-container {
            display: none;
            background-color: #2e4053;
            padding-left: 20px;
        }

        .dropdown-container a {
            padding: 12px 20px; 
            font-size: 14px;
        }
        
     
        .main-content {
            padding: 80px 20px 20px 20px;
            transition: margin-left 0.3s ease; 
            min-height: 100vh;
        }

    
        @media (min-width: 768px) {
            .sidebar.show + .main-content {
                margin-left: 250px; 
            }
        }

        
        .cursor-tail {
            position: absolute;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background-color: rgba(33, 18, 141, 0.7);
            pointer-events: none;
            
            transition: transform 0.5s ease-out, opacity 0.5s ease-out; 
            z-index: 9999;
        }

    </style>
</head>

    <script>
        const music = document.getElementById('bgMusic');
        const targetVolume = 0.4;

        const playMusicOnce = () => {
            music.muted = false;
            music.volume = 0;
            music.play().catch(e => console.log("Audio play blocked:", e));

            let currentVolume = 0;
            const fadeInterval = 100; 
            const fadeStep = targetVolume / (2000 / fadeInterval);

            const fade = setInterval(() => {
                if (currentVolume < targetVolume) {
                    currentVolume += fadeStep;
                    if (currentVolume > targetVolume) currentVolume = targetVolume;
                    music.volume = currentVolume;
                } else {
                    clearInterval(fade);
                }
            }, fadeInterval);

           
            document.body.removeEventListener('click', playMusicOnce);
            document.body.removeEventListener('touchstart', playMusicOnce);
        };

        
        document.body.addEventListener('click', playMusicOnce, {once: true}); 
        document.body.addEventListener('touchstart', playMusicOnce, {once: true});
    </script>


    <script>
        const menuBtn = document.getElementById('menuToggle');
        const sidebar = document.getElementById('sidebar');
        const mainContent = document.getElementById('mainContent');
        const dropdownBtns = document.querySelectorAll('.dropdown-btn');

      
        menuBtn.addEventListener('click', () => {
            sidebar.classList.toggle('show');
           
            if (window.innerWidth >= 768) {
                mainContent.style.marginLeft = sidebar.classList.contains('show') ? '250px' : '0';
            }
        });

       
        window.addEventListener('resize', () => {
            if (window.innerWidth < 768) {
                mainContent.style.marginLeft = '0';
            } else if (sidebar.classList.contains('show')) {
                
                 mainContent.style.marginLeft = '250px';
            }
        });

     
        dropdownBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const dropdown = btn.nextElementSibling;
               
                if (dropdown.style.display === "block") {
                    dropdown.style.display = "none";
                } else {
                    dropdown.style.display = "block";
                }
            });
        });
    </script>

    <script>
        document.addEventListener('mousemove', (event) => {
            const trail = document.createElement('div');
            trail.classList.add('cursor-tail');
            
           
            trail.style.left = `${event.clientX - 7.5}px`; 
            trail.style.top = `${event.clientY - 7.5}px`;
            
            document.body.appendChild(trail);

            
            setTimeout(() => {
               
                trail.style.transform = 'scale(0)';
                trail.style.opacity = 0;
                
               
                setTimeout(() => {
                    if (trail.parentElement) {
                        trail.parentElement.removeChild(trail);
                    }
                }, 500); 
            }, 10); 
        });
    </script>
